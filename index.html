<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Break timer</title>
 
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,300;1,600&display=swap" rel="stylesheet">
 
<style>
  :root{
    --bg: #102019;
    --bg-short: #12281f;
    --bg-long: #2a1c10;
    --ink: #ede8dd;
    --dim: rgba(237,232,221,.5);
    --ring-track: rgba(237,232,221,.14);
    --sage: #8fb89c;
  }
 
  *{ box-sizing: border-box; }
  html, body{ height:100%; margin:0; }
 
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 1.5rem;
  }
 
  .label{
    font-size: .85rem;
    color: var(--dim);
    margin: 0 0 1.1rem;
  }
 
  .ring-wrap{
    position:relative;
    width: 220px;
    height: 220px;
  }
 
  .ring-wrap svg{
    width:100%;
    height:100%;
    transform: rotate(-90deg);
  }
 
  .ring-track{
    fill:none;
    stroke: var(--ring-track);
    stroke-width: 3;
  }
 
  .ring-fg{
    fill:none;
    stroke: var(--sage);
    stroke-width: 3;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear;
  }
 
  .time{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: "Fraunces", serif;
    font-style: italic;
    font-weight: 300;
    font-size: 2.75rem;
    font-variant-numeric: tabular-nums;
  }
 
  .long-line{
    margin-top: 1.6rem;
    font-size: .95rem;
    color: var(--dim);
  }
 
  button{
    background:none;
    border:none;
    color: var(--ink);
    font: inherit;
    cursor:pointer;
  }
 
  .start{
    margin-top: 1.8rem;
    font-size: 1rem;
    border-bottom: 1px solid var(--ink);
    padding: .3rem 0;
  }
 
  .start[hidden]{ display:none; }
 
  .test{
    position: fixed;
    bottom: 1.25rem;
    right: 1.25rem;
    color: var(--dim);
    font-size: .8rem;
    padding: .3rem;
  }
 
  .overlay{
    position: fixed;
    inset: 0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 1.5rem;
    padding: 2rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity .6s ease, background-color .6s ease;
    background: var(--bg-short);
  }
 
  .overlay.long{ background: var(--bg-long); }
 
  .overlay.show{
    opacity: 1;
    pointer-events: auto;
  }
 
  .overlay-msg{
    font-family: "Fraunces", serif;
    font-style: italic;
    font-weight: 300;
    font-size: 1.9rem;
    max-width: 30ch;
    line-height: 1.3;
    margin:0;
  }
 
  .overlay-time{
    font-family: "Fraunces", serif;
    font-style: italic;
    font-weight: 600;
    font-size: 2.4rem;
    font-variant-numeric: tabular-nums;
    margin:0;
  }
 
  .skip{
    border-bottom: 1px solid var(--ink);
    padding: .3rem 0;
    font-size: 1rem;
  }
 
  button:focus-visible{
    outline: 2px solid var(--sage);
    outline-offset: 4px;
  }
 
  @media (prefers-reduced-motion: reduce){
    .ring-fg, .overlay{ transition: none; }
  }
</style>
</head>
<body>
 
  <main>
    <p class="label" id="label">ready when you are</p>
    <div class="ring-wrap">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle class="ring-track" cx="100" cy="100" r="90"></circle>
        <circle class="ring-fg" id="ring" cx="100" cy="100" r="90"></circle>
      </svg>
      <span class="time" id="time">20:00</span>
    </div>
    <p class="long-line" id="longLine">long break every 2 hours</p>
    <button class="start" id="startBtn" type="button">Start</button>
  </main>
 
  <button class="test" id="testBtn" type="button">test alert</button>
 
  <div class="overlay" id="breakOverlay" role="alertdialog" aria-live="assertive">
    <p class="overlay-msg" id="breakMsg"></p>
    <p class="overlay-time" id="breakTime"></p>
    <button class="skip" id="skipBtn" type="button">Skip break</button>
  </div>
 
<script>
  // ---- settings (change here) ----
  const SHORT_EVERY_MS = 20 * 60 * 1000;      // short break after 20 min of work
  const SHORT_BREAK_MS = 60 * 1000;           // short break lasts 1 min
  const LONG_EVERY_MS  = 2 * 60 * 60 * 1000;  // long break after 2 hours of work
  const LONG_BREAK_MS  = 5 * 60 * 1000;       // long break lasts 5 min
  const REPEAT_EVERY_MS = 30 * 1000;          // re-alert every 30 s until dismissed
  const MAX_REPEATS = 4;
 
  // ---- state (timestamp-based, so late timer callbacks never cause drift) ----
  let mode = 'idle';          // 'idle' | 'work' | 'break'
  let breakKind = null;       // 'short' | 'long'
  let breakEnd = 0;
  let shortAcc = 0;           // work ms since last break of any kind
  let cycleAcc = 0;           // work ms since last long break
  let lastTick = 0;
  let tickId = null;
  let repeatId = null;
  let repeats = 0;
  let flashId = null;
  let audioCtx = null;
 
  const $ = id => document.getElementById(id);
  const ring = $('ring');
  const timeEl = $('time');
  const labelEl = $('label');
  const longLineEl = $('longLine');
  const startBtn = $('startBtn');
  const overlay = $('breakOverlay');
  const breakMsg = $('breakMsg');
  const breakTime = $('breakTime');
  const circumference = 2 * Math.PI * 90;
  ring.style.strokeDasharray = circumference;
 
  const pad = n => String(n).padStart(2, '0');
  function mmss(ms){
    const s = Math.max(0, Math.ceil(ms / 1000));
    return Math.floor(s / 60) + ':' + pad(s % 60);
  }
  function hm(ms){
    const s = Math.max(0, Math.ceil(ms / 1000));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    return h > 0 ? `${h}h ${pad(m)}m` : `${m}m`;
  }
 
  // ---- sound: generated in code, no audio files ----
  function unlockAudio(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
 
  function tone(freq, offset, dur){
    const t = audioCtx.currentTime + offset;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.3, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  }
 
  function chime(kind){
    if(!audioCtx) return;
    const seq = kind === 'long' ? [523, 659, 784, 1047]
              : kind === 'short' ? [784, 1047]
              : [1047, 784];                       // 'back' to work
    seq.forEach((f, i) => tone(f, i * 0.4, 1.0));
  }
 
  function vibrate(kind){
    if(navigator.vibrate){
      navigator.vibrate(kind === 'long' ? [400, 150, 400, 150, 400] : [250, 120, 250]);
    }
  }
 
  // ---- notifications: shown whether or not the tab is in focus ----
  function notify(title, body, sticky){
    if(!('Notification' in window) || Notification.permission !== 'granted') return;
    try{
      const n = new Notification(title, { body, tag: 'break-timer', requireInteraction: sticky });
      n.onclick = () => { window.focus(); n.close(); };
    }catch(e){}
  }
 
  // ---- alert lifecycle ----
  function startAlerts(kind){
    stopAlerts();
    repeats = 0;
    repeatId = setInterval(() => {
      repeats++;
      chime(kind);
      vibrate(kind);
      if(repeats >= MAX_REPEATS) stopAlerts(false);
    }, REPEAT_EVERY_MS);
 
    // flash the tab title so the alert is visible from other tabs
    let on = true;
    flashId = setInterval(() => {
      document.title = on ? '● BREAK' : 'Break time';
      on = !on;
    }, 1000);
  }
 
  function stopAlerts(clearTitle = true){
    clearInterval(repeatId); repeatId = null;
    clearInterval(flashId); flashId = null;
    if(clearTitle) document.title = 'Break timer';
  }
 
  function startBreak(kind){
    mode = 'break';
    breakKind = kind;
    breakEnd = Date.now() + (kind === 'long' ? LONG_BREAK_MS : SHORT_BREAK_MS);
    shortAcc = 0;
    if(kind === 'long') cycleAcc = 0;
 
    overlay.classList.toggle('long', kind === 'long');
    breakMsg.textContent = kind === 'long'
      ? 'Five minutes. Stand up, stretch, look far away.'
      : 'Step away for a few breaths.';
    overlay.classList.add('show');
 
    chime(kind);
    vibrate(kind);
    notify(kind === 'long' ? 'Long break' : 'Short break', breakMsg.textContent, kind === 'long');
    startAlerts(kind);
  }
 
  function endBreak(){
    mode = 'work';
    const finished = breakKind;
    breakKind = null;
    stopAlerts();
    overlay.classList.remove('show');
    chime('back');
    notify('Back to work', 'Your next break is on its way.', false);
    lastTick = Date.now();
  }
 
  // ---- main loop ----
  function tick(){
    const now = Date.now();
    const delta = now - lastTick;
    lastTick = now;
 
    if(mode === 'work'){
      shortAcc += delta;
      cycleAcc += delta;
      if(cycleAcc >= LONG_EVERY_MS)      startBreak('long');
      else if(shortAcc >= SHORT_EVERY_MS) startBreak('short');
    } else if(mode === 'break' && now >= breakEnd){
      endBreak();
    }
 
    render();
  }
 
  function render(){
    if(mode === 'break'){
      breakTime.textContent = mmss(breakEnd - Date.now());
      timeEl.textContent = mmss(breakEnd - Date.now());
      labelEl.textContent = breakKind === 'long' ? 'long break' : 'short break';
      ring.style.strokeDashoffset = 0;
      return;
    }
    if(mode === 'work'){
      const left = SHORT_EVERY_MS - shortAcc;
      const frac = Math.max(0, Math.min(1, left / SHORT_EVERY_MS));
      ring.style.strokeDashoffset = circumference * (1 - frac);
      timeEl.textContent = mmss(left);
      labelEl.textContent = 'next short break';
      longLineEl.textContent = `long break in ${hm(LONG_EVERY_MS - cycleAcc)}`;
      document.title = `${mmss(left)} · Break timer`;
    }
  }
 
  // ---- controls ----
  startBtn.addEventListener('click', () => {
    unlockAudio();                       // browsers require a click before sound
    if('Notification' in window && Notification.permission === 'default'){
      Notification.requestPermission();
    }
    mode = 'work';
    shortAcc = 0;
    cycleAcc = 0;
    lastTick = Date.now();
    startBtn.hidden = true;
    labelEl.textContent = 'next short break';
    if(!tickId) tickId = setInterval(tick, 1000);
    render();
  });
 
  $('skipBtn').addEventListener('click', endBreak);
 
  $('testBtn').addEventListener('click', () => {
    unlockAudio();
    if('Notification' in window && Notification.permission === 'default'){
      Notification.requestPermission();
    }
    chime('short');
    vibrate('short');
    notify('Test alert', 'Alerts are working.', false);
  });
 
  render();
</script>
</body>
</html>
