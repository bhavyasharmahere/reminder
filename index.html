<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Break timer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,300;1,600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #102019;
    --bg-short: #12281f;
    --bg-long: #2a1c10;
    --ink: #ede8dd;
    --dim: rgba(237,232,221,.5);
    --ring-track: rgba(237,232,221,.14);
    --sage: #8fb89c;
    --amber: #e3a857;
  }

  *{ box-sizing: border-box; }

  html,body{
    height:100%;
    margin:0;
  }

  body{
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    text-align:center;
    padding: 1.5rem;
  }

  .label{
    font-size: .85rem;
    color: var(--dim);
    margin: 0 0 1.1rem;
    letter-spacing: .01em;
  }

  .ring-wrap{
    position:relative;
    width: 220px;
    height: 220px;
    animation: breathe 6s ease-in-out infinite;
  }

  .ring-wrap svg{
    width:100%;
    height:100%;
    transform: rotate(-90deg);
  }

  .ring-track{
    fill:none;
    stroke: var(--ring-track);
    stroke-width: 3;
  }

  .ring-fg{
    fill:none;
    stroke: var(--sage);
    stroke-width: 3;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear;
  }

  .time{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: "Fraunces", serif;
    font-style: italic;
    font-weight: 300;
    font-size: 2.75rem;
  }

  .long-line{
    margin-top: 1.6rem;
    font-size: .95rem;
    color: var(--dim);
  }

  .notify-toggle{
    position: fixed;
    bottom: 1.25rem;
    right: 1.25rem;
    background:none;
    border:none;
    color: var(--dim);
    font: inherit;
    font-size: .8rem;
    cursor:pointer;
    padding: .3rem;
  }

  .overlay{
    position: fixed;
    inset: 0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 1.5rem;
    padding: 2rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity .6s ease;
  }

  .overlay.show{
    opacity: 1;
    pointer-events: auto;
  }

  #shortOverlay{ background: var(--bg-short); }
  #longOverlay{ background: var(--bg-long); }

  .overlay-msg{
    font-family: "Fraunces", serif;
    font-style: italic;
    font-weight: 300;
    font-size: 1.9rem;
    max-width: 30ch;
    line-height: 1.3;
    margin:0;
  }

  .overlay-time{
    font-family: "Fraunces", serif;
    font-style: italic;
    font-weight: 600;
    font-size: 2.4rem;
    margin:0;
  }

  .overlay button{
    background:none;
    border:none;
    border-bottom: 1px solid var(--ink);
    color: var(--ink);
    font: inherit;
    font-size: 1rem;
    padding: .3rem 0;
    cursor:pointer;
  }

  button:focus-visible{
    outline: 2px solid var(--sage);
    outline-offset: 4px;
  }

  @keyframes breathe{
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); }
  }

  @media (prefers-reduced-motion: reduce){
    .ring-wrap{ animation: none; }
    .ring-fg{ transition: none; }
    .overlay{ transition: none; }
  }
</style>
</head>
<body>

  <main>
    <p class="label">next short break</p>
    <div class="ring-wrap">
      <svg viewBox="0 0 200 200">
        <circle class="ring-track" cx="100" cy="100" r="90"></circle>
        <circle class="ring-fg" id="ring" cx="100" cy="100" r="90"></circle>
      </svg>
      <span class="time" id="shortTime">20:00</span>
    </div>
    <p class="long-line" id="longLine">long break in 2h 00m</p>
  </main>

  <button class="notify-toggle" id="notifyBtn" type="button">enable notifications</button>

  <div class="overlay" id="shortOverlay">
    <p class="overlay-msg">Step away for a few breaths.</p>
    <button id="shortDone" type="button">Back to it</button>
  </div>

  <div class="overlay" id="longOverlay">
    <p class="overlay-msg">Five minutes. Stretch, walk, look far away.</p>
    <p class="overlay-time" id="longCountdown">5:00</p>
    <button id="longDone" type="button">Back to it</button>
  </div>

<script>
  const SHORT_SECS = 20 * 60;
  const LONG_SECS = 2 * 60 * 60;
  const LONG_BREAK_DURATION = 5 * 60;

  let shortLeft = SHORT_SECS;
  let longLeft = LONG_SECS;
  let longBreakRemaining = null;

  const ring = document.getElementById('ring');
  const shortTimeEl = document.getElementById('shortTime');
  const longLineEl = document.getElementById('longLine');
  const shortOverlay = document.getElementById('shortOverlay');
  const longOverlay = document.getElementById('longOverlay');
  const longCountdownEl = document.getElementById('longCountdown');
  const notifyBtn = document.getElementById('notifyBtn');

  const circumference = 2 * Math.PI * 90;
  ring.style.strokeDasharray = circumference;

  let notifyEnabled = false;

  function mmss(s){
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return m + ':' + String(sec).padStart(2, '0');
  }

  function longFormat(s){
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    return h > 0 ? `${h}h ${String(m).padStart(2,'0')}m` : `${m}m`;
  }

  function notify(title, body){
    if(!notifyEnabled || !('Notification' in window) || !document.hidden) return;
    try{ new Notification(title, { body }); } catch(e){}
  }

  function showOverlay(el){
    el.classList.add('show');
  }

  function hideOverlay(el){
    el.classList.remove('show');
  }

  function updateUI(){
    shortTimeEl.textContent = mmss(shortLeft);
    longLineEl.textContent = `long break in ${longFormat(longLeft)}`;
    const frac = shortLeft / SHORT_SECS;
    ring.style.strokeDashoffset = circumference * (1 - frac);
    document.title = `${mmss(shortLeft)} · next break`;
  }

  function triggerShort(){
    showOverlay(shortOverlay);
    notify('Short break', 'Step away for a few breaths.');
  }

  function triggerLong(){
    longBreakRemaining = LONG_BREAK_DURATION;
    longCountdownEl.textContent = mmss(longBreakRemaining);
    showOverlay(longOverlay);
    notify('Long break', 'Five minutes — stretch and walk.');
  }

  document.getElementById('shortDone').addEventListener('click', () => {
    hideOverlay(shortOverlay);
    shortLeft = SHORT_SECS;
    updateUI();
  });

  document.getElementById('longDone').addEventListener('click', () => {
    hideOverlay(longOverlay);
    longBreakRemaining = null;
    shortLeft = SHORT_SECS;
    longLeft = LONG_SECS;
    updateUI();
  });

  notifyBtn.addEventListener('click', async () => {
    if(!('Notification' in window)){
      notifyBtn.textContent = 'notifications unavailable';
      return;
    }
    if(Notification.permission === 'granted'){
      notifyEnabled = true;
    } else {
      const p = await Notification.requestPermission();
      notifyEnabled = (p === 'granted');
    }
    notifyBtn.textContent = notifyEnabled ? 'notifications on' : 'enable notifications';
  });

  setInterval(() => {
    if(longBreakRemaining !== null){
      longBreakRemaining--;
      longCountdownEl.textContent = mmss(Math.max(longBreakRemaining, 0));
      if(longBreakRemaining <= 0){
        hideOverlay(longOverlay);
        longBreakRemaining = null;
        shortLeft = SHORT_SECS;
        longLeft = LONG_SECS;
        updateUI();
      }
      return;
    }

    shortLeft--;
    longLeft--;

    if(longLeft <= 0){
      triggerLong();
      longLeft = LONG_SECS;
      shortLeft = SHORT_SECS;
    } else if(shortLeft <= 0){
      triggerShort();
      shortLeft = SHORT_SECS;
    }

    updateUI();
  }, 1000);

  updateUI();
</script>
</body>
</html>
